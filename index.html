<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Education App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .login-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #2c3e50;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>My Education App</h1>

        <p>Please login to continue</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button class="login-button" onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script>

function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "student" && password === "1234") {

        window.location.href = "dashboard.html";

    } else {

        document.getElementById("message").innerText =
            "Incorrect username or password.";

    }

}

</script>

</body>
</html>
